openapi: 3.0.3
info:
  title: Go Webapp Template API
  version: 0.3.0
  description: |
    Go Webapp Template identity and authentication API. This is the contract-first
    source of truth for the REST surface: Go transport types are generated
    from this file (see `make openapi-generate`), never the other way
    around.

    ## Versioning

    Two different version numbers appear here, and they are not the same
    concept:

    - The **URL major version** (`/api/v1`) is a compatibility boundary.
      It changes only for a breaking change — a removed or renamed field,
      a changed field type, incompatibly changed semantics, a restructured
      request or response. A new endpoint, a new optional response field,
      or a new optional query parameter are all backward compatible and
      stay on `/api/v1`.
    - **`info.version`** above is this document's own revision. It moves
      for any published change, including backward-compatible ones, while
      the URL major stays put.

    So `/api/v1` is expected to outlive many `info.version` bumps. When a
    genuinely breaking change does arrive, `/api/v2` is added alongside
    `/api/v1` rather than replacing it in place.

    Operational endpoints (`/health`) are infrastructure, not part of the
    public business API, and are deliberately unversioned: monitoring and
    orchestration probe a stable path that never moves with the API's
    compatibility boundary.
servers:
  - url: /
    description: Same-origin server root (paths below include their own /api/v1 prefix)
tags:
  - name: health
    description: Operational status endpoints (unversioned)
  - name: auth
    description: Registration, session, and authentication endpoints
security: []
paths:
  /health:
    get:
      tags: [health]
      summary: Service liveness check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                value:
                  email: user@example.com
                  password: supersecretpassword
      responses:
        '201':
          description: User created and verification delivery queued; email arrival is asynchronous
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid request body, email, phone, or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidEmail:
                  value: {error: {code: invalid_email, message: Invalid email address}}
                invalidPassword:
                  value: {error: {code: invalid_password, message: Password does not meet length requirements}}
        '409':
          description: Email or phone number is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emailExists:
                  value: {error: {code: email_already_exists, message: Email already exists}}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      summary: Verify an email address using its one-time token
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Email verified and token consumed
        '400':
          description: Malformed request or invalid, expired, consumed, or replaced token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: invalid_email_verification, message: Email verification link is invalid or expired}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/resend-verification:
    post:
      tags: [auth]
      summary: Request another verification email for the signed-in account
      operationId: resendEmailVerification
      description: |
        No request body. Uses the authenticated account's email address.
        Replaces previous credentials atomically. Already verified accounts
        return the same status without sending. Unverified users can sign in.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Delivery queued, or account already verified
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for an access/refresh token pair
      description: Email verification is not required to sign in.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: user@example.com
                  password: supersecretpassword
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: {code: invalid_credentials, message: Invalid email or password}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token for a new access/refresh token pair
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Refresh token is invalid, reused, expired, or its account is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRefreshToken:
                  value: {error: {code: invalid_refresh_token, message: Invalid refresh token}}
                accountDisabled:
                  value: {error: {code: account_disabled, message: Account is disabled}}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session's refresh token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Get the authenticated user's profile
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: unauthorized, message: Unauthorized}
    PayloadTooLarge:
      description: Request body exceeded the maximum allowed size
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: request_body_too_large, message: Request body is too large}
    UnsupportedMediaType:
      description: Content-Type was missing or was not application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: unsupported_content_type, message: Content-Type must be application/json}
    TooManyRequests:
      description: |
        The caller exceeded a rate limit and should retry after the
        interval given in the Retry-After header.

        Every endpoint under /api is covered by a generic per-IP limit;
        the authentication endpoints carry stricter limits on top. The
        response is deliberately identical whichever limit was reached,
        so it reveals nothing about which one — in particular nothing
        about whether an account exists.
      headers:
        Retry-After:
          description: Whole seconds to wait before retrying, rounded up.
          required: true
          schema:
            type: integer
            minimum: 1
          example: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: rate_limit_exceeded, message: Too many requests}
    InternalServerError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: internal_error, message: Internal server error}
  schemas:
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              example: invalid_credentials
            message:
              type: string
              description: Human-readable presentation text. Never contains internal details.
              example: Invalid email or password
    User:
      type: object
      description: |
        A user's public profile. Never includes credential material
        (password hash, refresh token hash) or other infrastructure
        fields.
      required: [id, email, status, email_verified, phone_verified, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: A bare RFC 5322 mailbox address (no display-name form).
        phone:
          type: string
          nullable: true
          example: '+15551234567'
        status:
          type: string
          enum: [active, disabled]
        email_verified:
          type: boolean
        phone_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: A bare RFC 5322 mailbox address (no display-name form).
        password:
          type: string
          minLength: 8
          maxLength: 256
        phone:
          type: string
          nullable: true
          description: E.164 format.
          example: '+15551234567'
    RegisterResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: A bare RFC 5322 mailbox address (no display-name form).
        password:
          type: string
    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          description: Opaque credential; returned only once and never stored raw.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Seconds until the access token expires.
        user:
          $ref: '#/components/schemas/User'
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    RefreshResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          description: A newly rotated opaque credential; the previous one is now invalid.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
